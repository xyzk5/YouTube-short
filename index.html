ery_app.conf.task_time_limit=7200\n", "text": true}, {"name": "youtube-shorts-ai-clipper/backend/app/workers/cleanup.py", "size": 606, "content": "from datetime import datetime,timezone\nfrom ..db import SessionLocal\nfrom ..models import Job\nfrom ..storage.s3 import client\nfrom ..config import get_settings\n\ndef main():\n    db=SessionLocal(); s=get_settings(); now=datetime.now(timezone.utc)\n    for j in db.query(Job).filter(Job.expires_at!=None,Job.expires_at<now).all():\n        try:\n            c=client()\n            for clip in j.clips:\n                try:c.delete_object(Bucket=s.storage_bucket,Key=clip.storage_key)\n                except Exception:pass\n        finally: db.delete(j)\n    db.commit(); db.close()\nif __name__=='__main__': main()\n", "text": true}, {"name": "youtube-shorts-ai-clipper/backend/app/workers/tasks.py", "size": 4012, "content": "import uuid, shutil, os\nfrom pathlib import Path\nfrom datetime import datetime, timezone, timedelta\nfrom sqlalchemy.orm import Session\nfrom .celery_app import celery_app\nfrom ..db import SessionLocal\nfrom ..models import Job, Clip\nfrom ..config import get_settings\nfrom ..services.media import download,duration,extract_audio,render_clip\nfrom ..services.transcription import transcribe\nfrom ..services.ai import choose_clips\nfrom ..services.captions import make_srt\nfrom ..storage.s3 import put,ensure_bucket\n\nSTAGES=['Validating URL','Preparing job','Downloading video','Extracting audio','Generating transcript','Analyzing transcript','Selecting best moments','Validating clips','Rendering clips','Generating captions','Finalizing files','Uploading results','Completed']\ndef update(db,j,stage,progress=None): j.current_stage=stage; j.progress=progress; db.commit()\n\ndef validate_candidates(cands,src_dur,min_dur,max_dur,count):\n    out=[]\n    for c in sorted(cands,key=lambda x:float(x.get('score',0)),reverse=True):\n        try: a=float(c['start']); b=float(c['end']);\n        except: continue\n        if a<0 or b<=a or b>src_dur or not(min_dur<=b-a<=max_dur): continue\n        if any(max(a,x['start']) < min(b,x['end']) for x in out): continue\n        out.append({'start':round(a,2),'end':round(b,2),'title':str(c.get('title','Selected moment'))[:200],'reason':str(c.get('reason',''))[:500],'score':float(c.get('score',0))})\n        if len(out)>=count: break\n    return out\n\n@celery_app.task(bind=True,max_retries=2)\ndef process_job(self,job_id):\n    db:Session=SessionLocal(); j=db.get(Job,job_id); s=get_settings(); work=Path('/tmp/clipper')/job_id; work.mkdir(parents=True,exist_ok=True)\n    try:\n        j.status='processing'; j.started_at=datetime.now(timezone.utc); db.commit(); update(db,j,STAGES[0],5)\n        video,info=download(j.youtube_url,work); j.source_title=info.get('title'); src_dur=duration(video); j.source_duration=src_dur\n        if src_dur>s.max_video_duration_seconds: raise ValueError('This video exceeds the maximum allowed duration.')\n        if video.stat().st_size>s.max_file_size_mb*1024*1024: raise ValueError('This video exceeds the maximum allowed file size.')\n        update(db,j,STAGES[2],15); audio=work/'audio.wav'; extract_audio(video,audio); update(db,j,STAGES[4],30)\n        tr=transcribe(audio); update(db,j,STAGES[5],40)\n        min_d=15; max_d=60\n        if j.max_clip_duration and j.min_clip_duration: min_d=j.min_clip_duration; max_d=j.max_clip_duration\n        cands=choose_clips(tr,j.requested_clip_count,min_d,max_d,j.settings_json.get('clip_type','auto')); update(db,j,STAGES[7],55)\n        clips=validate_candidates(cands,src_dur,min_d,max_d,j.requested_clip_count)\n        if not clips: raise ValueError('No suitable clip moments were found. Try another video or settings.')\n        update(db,j,STAGES[8],65); ensure_bucket()\n        for i,c in enumerate(clips,1):\n            clip_id=str(uuid.uuid4()); out=work/f'{clip_id}.mp4'; srt=work/f'{clip_id}.srt'; make_srt(tr.get('words',[]),c['start'],c['end'],srt); render_clip(video,out,c['start'],c['end'],srt,j.settings_json.get('caption_style','bold'))\n            key=f'jobs/{job_id}/{clip_id}.mp4'; put(out,key)\n            db.add(Clip(id=clip_id,job_id=job_id,start_time=c['start'],end_time=c['end'],duration=c['end']-c['start'],title=c['title'],reason=c['reason'],ai_score=c['score'],storage_key=key,expires_at=datetime.now(timezone.utc)+timedelta(hours=s.job_retention_hours)))\n            db.commit(); update(db,j,STAGES[11],65+int(i/len(clips)*30))\n        j.status='completed'; j.progress=100; j.current_stage='Completed'; j.completed_at=datetime.now(timezone.utc); j.expires_at=datetime.now(timezone.utc)+timedelta(hours=s.job_retention_hours); db.commit()\n    except Exception as e:\n        j.status='failed'; j.error_message=str(e)[:500]; j.error_code='PROCESSING_ERROR'; j.current_stage='Failed'; db.commit()\n        raise\n    finally:\n        shutil.rmtree(work,ignore_errors=True); db.close()\n", "text": true}, {"name": "youtube-shorts-ai-clipper/backend/Dockerfile", "size": 227, "content": null, "text": false}, {"name": "youtube-shorts-ai-clipper/backend/requirements.txt", "size": 259, "content": "fastapi>=0.115,<1\nuvicorn[standard]>=0.30,<1\npydantic>=2.8,<3\npydantic-settings>=2.4,<3\nsqlalchemy>=2.0,<3\npsycopg[binary]>=3.2,<4\ncelery>=5.4,<6\nredis>=5,<6\nopenai>=1.50,<3\nboto3>=1.35,<2\nyt-dlp>=2025.1\npython-multipart>=0.0.9,<1\nhttpx>=0.27,<1\npytest>=8,<9\n", "text": true}, {"name": "youtube-shorts-ai-clipper/backend/tests/__pycache__/test_api.cpython-313.pyc", "size": 640, "content": null, "text": false}, {"name": "youtube-shorts-ai-clipper/backend/tests/test_api.py", "size": 318, "content": "import os\nos.environ['DATABASE_URL']='sqlite:///./test.db'\nfrom app.services.url import validate_youtube_url\n\ndef test_youtube_url():\n    assert validate_youtube_url('https://www.youtube.com/watch?v=x')\n    assert validate_youtube_url('https://youtu.be/x')\n    assert not validate_youtube_url('https://example.com/x')\n", "text": true}, {"name": "youtube-shorts-ai-clipper/docker-compose.yml", "size": 1782, "content": "services:\n  postgres:\n    image: postgres:16-alpine\n    environment:\n      POSTGRES_DB: clipper\n      POSTGRES_USER: clipper\n      POSTGRES_PASSWORD: clipper\n    volumes: [pgdata:/var/lib/postgresql/data]\n    healthcheck: {test: [\"CMD-SHELL\", \"pg_isready -U clipper -d clipper\"], interval: 5s, timeout: 5s, retries: 10}\n  redis:\n    image: redis:7-alpine\n    healthcheck: {test: [\"CMD\", \"redis-cli\", \"ping\"], interval: 5s, timeout: 3s, retries: 10}\n  minio:\n    image: minio/minio\n    command: server /data --console-address \":9001\"\n    environment: {MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin}\n    ports: [\"9000:9000\", \"9001:9001\"]\n    volumes: [miniodata:/data]\n  api:\n    build: {context: ./backend, dockerfile: Dockerfile}\n    env_file: .env\n    command: uvicorn app.main:app --host 0.0.0.0 --port 8000\n    volumes: [\"./backend:/app\", \"media:/tmp/clipper\"]\n    ports: [\"8000:8000\"]\n    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}\n  worker:\n    build: {context: ./backend, dockerfile: Dockerfile}\n    env_file: .env\n    command: celery -A app.workers.celery_app worker --loglevel=INFO --concurrency=2\n    volumes: [\"./backend:/app\", \"media:/tmp/clipper\"]\n    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}\n  cleanup:\n    build: {context: ./backend, dockerfile: Dockerfile}\n    env_file: .env\n    command: python -m app.workers.cleanup\n    volumes: [\"./backend:/app\", \"media:/tmp/clipper\"]\n    depends_on: {postgres: {condition: service_healthy}}\n  frontend:\n    build: {context: ./frontend, dockerfile: Dockerfile}\n    environment: {NEXT_PUBLIC_API_URL: http://localhost:8000}\n    ports: [\"3000:3000\"]\n    depends_on: [api]\nvolumes: {pgdata: {}, miniodata: {}, media: {}}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/docs/API.md", "size": 305, "content": "# API\n\n- `POST /api/jobs` create background job\n- `GET /api/jobs/{job_id}` status\n- `POST /api/jobs/{job_id}/cancel` cancel\n- `GET /api/jobs/{job_id}/clips` generated clips\n- `GET /api/clips/{clip_id}/download` signed media URL\n- `GET /api/health` health\n\nFastAPI also exposes OpenAPI/Swagger at `/docs`.\n", "text": true}, {"name": "youtube-shorts-ai-clipper/docs/DEPLOYMENT.md", "size": 738, "content": "# Deployment\n\nThe project is provider-agnostic. A practical production topology is:\n\n- Next.js frontend\n- FastAPI API\n- Redis\n- one or more Celery workers\n- PostgreSQL\n- Cloudflare R2/S3/Supabase-compatible object storage\n\nSet all `.env` values in the hosting provider's secret/environment settings. Never put `OPENAI_API_KEY` in frontend variables.\n\nFor Railway/Render/Fly.io/VPS, create separate services for frontend, API and worker. Worker machines should have FFmpeg and yt-dlp. Attach persistent database/storage services and configure HTTPS/domain routing.\n\nFor low-resource hosting, keep `MAX_CONCURRENT_JOBS` small. Heavy FFmpeg processing can exceed a basic web-service CPU/RAM budget, so separate worker capacity is important.\n", "text": true}, {"name": "youtube-shorts-ai-clipper/docs/LOCAL_DEVELOPMENT.md", "size": 755, "content": "# Local development\n\n## Backend\n\nPython 3.12+, FFmpeg and yt-dlp are required.\n\n```bash\ncd backend\npython -m venv .venv\n# Linux/macOS: source .venv/bin/activate\n# Windows: .venv\\\\Scripts\\\\activate\npip install -r requirements.txt\nuvicorn app.main:app --reload --port 8000\n```\n\nRun Redis/PostgreSQL or use Docker Compose. For quick API-only development the default SQLite URL can be used, but Celery still needs Redis.\n\n## Frontend\n\n```bash\ncd frontend\nnpm install\nNEXT_PUBLIC_API_URL=http://localhost:8000 npm run dev\n```\n\n## Termux\n\nInstall Python, Node.js, FFmpeg and yt-dlp through the available Termux packages. Running the full production stack on a phone is for testing only; large FFmpeg jobs should run on a server with sufficient CPU/RAM/storage.\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/app/globals.css", "size": 467, "content": "@tailwind base;@tailwind components;@tailwind utilities;\n:root{color-scheme:dark}body{margin:0;background:#090b10;color:#f4f5f7;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif}button,input,select{font:inherit}.card{background:#11151d;border:1px solid #222936;border-radius:18px}.muted{color:#9aa4b2}.primary{background:#7c3aed}.primary:hover{background:#6d28d9}.focusable:focus{outline:2px solid #a78bfa;outline-offset:2px}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/app/layout.tsx", "size": 262, "content": "import './globals.css'; export const metadata={title:'YouTube Long-to-Shorts AI Clipper',description:'AI video clipping workspace'}; export default function RootLayout({children}:{children:React.ReactNode}){return <html lang=\"en\"><body>{children}</body></html>}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/app/page.tsx", "size": 6821, "content": "'use client';\nimport {useEffect,useState} from 'react'; import {createJob,getJob,getClips,cancelJob} from '../lib/api';\nconst stages=['Validating URL','Preparing job','Downloading video','Extracting audio','Generating transcript','Analyzing transcript','Selecting best moments','Validating clips','Rendering clips','Generating captions','Finalizing files','Uploading results','Completed'];\nexport default function Home(){\n const [url,setUrl]=useState('');const [count,setCount]=useState('3');const [duration,setDuration]=useState('auto');const [type,setType]=useState('auto');const [style,setStyle]=useState('bold');const [position,setPosition]=useState('bottom');const [job,setJob]=useState<any>(null);const [clips,setClips]=useState<any[]>([]);const [error,setError]=useState('');\n useEffect(()=>{if(!job?.id||['completed','failed','cancelled'].includes(job.status))return;const t=setInterval(async()=>{try{const j=await getJob(job.id);setJob(j);if(j.status==='completed')setClips(await getClips(j.id))}catch(e:any){setError(e.message)}},1800);return()=>clearInterval(t)},[job?.id,job?.status]);\n async function generate(){setError('');setClips([]);try{const x=await createJob({youtube_url:url,clip_count:Number(count),duration:duration==='auto'?'auto':Number(duration),clip_type:type,caption_style:style,caption_position:position,aspect_ratio:'9:16'});setJob({id:x.job_id,status:x.status,progress:0,current_stage:'Preparing job',completed_clips:0,total_clips:Number(count)})}catch(e:any){setError(e.message)}}\n return <main className=\"min-h-screen\"><header className=\"sticky top-0 z-10 border-b border-white/10 bg-[#090b10]/90 backdrop-blur\"><div className=\"mx-auto flex max-w-6xl items-center justify-between px-4 py-4\"><div><div className=\"text-sm font-semibold text-violet-300\">AI VIDEO TOOL</div><h1 className=\"text-lg font-bold\">YouTube Long-to-Shorts AI Clipper</h1></div><nav className=\"hidden gap-6 text-sm text-slate-300 sm:flex\"><a href=\"#home\">Home</a><a href=\"#shorts\">My Shorts</a><a href=\"#processing\">Processing</a><a href=\"#settings\">Settings</a></nav></div></header>\n <div id=\"home\" className=\"mx-auto max-w-6xl px-4 py-8\"><section className=\"card p-5 sm:p-7\"><div className=\"max-w-3xl\"><p className=\"mb-2 text-sm font-medium text-violet-300\">CREATE SHORTS FROM YOUTUBE</p><h2 className=\"text-3xl font-bold tracking-tight sm:text-4xl\">Turn long videos into vertical Shorts.</h2><p className=\"muted mt-3 text-sm\">AI finds candidate moments, reframes to 9:16 and burns synchronized captions.</p></div><div className=\"mt-6 flex flex-col gap-3 sm:flex-row\"><input className=\"focusable min-w-0 flex-1 rounded-xl border border-white/10 bg-black/20 px-4 py-3\" placeholder=\"Paste YouTube video URL\" value={url} onChange={e=>setUrl(e.target.value)}/><button className=\"primary focusable rounded-xl px-5 py-3 font-semibold\" onClick={generate}>Generate Shorts</button></div><p className=\"muted mt-2 text-xs\">Example: https://www.youtube.com/watch?v=XXXXXXXX</p></section>\n <section id=\"settings\" className=\"mt-5 grid gap-4 sm:grid-cols-2 lg:grid-cols-4\"><Setting label=\"Number of Shorts\"><select className=\"w-full rounded-lg bg-black/20 p-2\" value={count} onChange={e=>setCount(e.target.value)}><option>1</option><option>3</option><option>5</option><option>10</option></select></Setting><Setting label=\"Clip Duration\"><select className=\"w-full rounded-lg bg-black/20 p-2\" value={duration} onChange={e=>setDuration(e.target.value)}><option value=\"auto\">Auto</option><option>15</option><option>30</option><option>45</option><option>60</option></select></Setting><Setting label=\"Clip Type\"><select className=\"w-full rounded-lg bg-black/20 p-2\" value={type} onChange={e=>setType(e.target.value)}>{['auto','funny','viral / high engagement','important moment','emotional','educational','best moments'].map(x=><option key={x}>{x}</option>)}</select></Setting><Setting label=\"Caption Style\"><select className=\"w-full rounded-lg bg-black/20 p-2\" value={style} onChange={e=>setStyle(e.target.value)}>{['clean','bold','highlight words','minimal','social media'].map(x=><option key={x}>{x}</option>)}</select></Setting></section>\n {error&&<div className=\"mt-5 rounded-xl border border-red-400/30 bg-red-400/10 p-4 text-sm text-red-200\">{error}</div>}\n {job&&<section id=\"processing\" className=\"card mt-5 p-5\"><div className=\"flex items-center justify-between gap-3\"><div><p className=\"text-sm font-semibold\">Processing</p><p className=\"muted text-sm\">{job.current_stage}</p></div>{!['completed','failed','cancelled'].includes(job.status)&&<button className=\"rounded-lg border border-white/10 px-3 py-2 text-sm\" onClick={()=>cancelJob(job.id).then(()=>setJob({...job,status:'cancelled',current_stage:'Cancelled'}))}>Cancel</button>}</div><div className=\"mt-4 h-2 overflow-hidden rounded-full bg-white/10\"><div className=\"h-full bg-violet-500 transition-all\" style={{width:`${job.progress??0}%`}}/></div><div className=\"mt-2 flex justify-between text-xs\"><span className=\"muted\">{job.status}</span><span className=\"muted\">{job.completed_clips}/{job.total_clips} clips</span></div><div className=\"mt-5 grid grid-cols-2 gap-2 sm:grid-cols-4\">{stages.map((s,i)=><div key={s} className={`rounded-lg border p-2 text-xs ${s===job.current_stage?'border-violet-400/50 bg-violet-400/10':'border-white/5'}`}><span className=\"muted\">{i+1}.</span> {s}</div>)}</div></section>}\n {clips.length>0&&<section id=\"shorts\" className=\"mt-8\"><div className=\"mb-4 flex items-end justify-between\"><div><p className=\"text-sm font-semibold text-violet-300\">MY SHORTS</p><h2 className=\"text-2xl font-bold\">Generated clips</h2></div></div><div className=\"grid gap-5 sm:grid-cols-2 lg:grid-cols-3\">{clips.map((c,i)=><article className=\"card overflow-hidden\" key={c.id}><div className=\"aspect-[9/16] bg-black\"><video controls preload=\"metadata\" className=\"h-full w-full object-contain\" src={c.download_url}/></div><div className=\"p-4\"><h3 className=\"font-semibold\">{i+1}. {c.title}</h3><p className=\"muted mt-1 text-xs\">{Math.round(c.duration)}s · {c.reason}</p><div className=\"mt-3 flex gap-2\"><a className=\"primary rounded-lg px-3 py-2 text-sm font-medium\" href={c.download_url} download>Download</a><button className=\"rounded-lg border border-white/10 px-3 py-2 text-sm\" onClick={()=>navigator.share?navigator.share({title:c.title,url:c.download_url}):navigator.clipboard.writeText(c.download_url)}>Share / Copy</button></div></div></article>)}</div></section>}\n <footer className=\"muted py-10 text-xs\">Only process content you are authorized to download, edit and publish. Platform terms and copyright rules still apply.</footer></div></main>}\nfunction Setting({label,children}:{label:string,children:React.ReactNode}){return <div className=\"card p-4\"><label className=\"mb-2 block text-xs font-medium text-slate-300\">{label}</label>{children}</div>}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/Dockerfile", "size": 118, "content": null, "text": false}, {"name": "youtube-shorts-ai-clipper/frontend/lib/api.ts", "size": 776, "content": "const API=process.env.NEXT_PUBLIC_API_URL||'http://localhost:8000';\nexport async function createJob(payload:any){const r=await fetch(`${API}/api/jobs`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok)throw new Error((await r.json()).detail||'Unable to create job');return r.json()}\nexport async function getJob(id:string){const r=await fetch(`${API}/api/jobs/${id}`,{cache:'no-store'});if(!r.ok)throw new Error('Job unavailable');return r.json()}\nexport async function getClips(id:string){const r=await fetch(`${API}/api/jobs/${id}/clips`,{cache:'no-store'});if(!r.ok)throw new Error('Clips unavailable');return r.json()}\nexport async function cancelJob(id:string){await fetch(`${API}/api/jobs/${id}/cancel`,{method:'POST'})}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/next-env.d.ts", "size": 81, "content": "/// <reference types=\"next\" />\n/// <reference types=\"next/image-types/global\" />\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/next.config.js", "size": 79, "content": "/** @type {import('next').NextConfig} */\nmodule.exports={reactStrictMode:true}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/package.json", "size": 328, "content": "{\"scripts\":{\"dev\":\"next dev\",\"build\":\"next build\",\"start\":\"next start\"},\"dependencies\":{\"next\":\"14.2.15\",\"react\":\"18.3.1\",\"react-dom\":\"18.3.1\"},\"devDependencies\":{\"typescript\":\"5.6.3\",\"tailwindcss\":\"3.4.14\",\"postcss\":\"8.4.47\",\"autoprefixer\":\"10.4.20\",\"@types/node\":\"22.8.1\",\"@types/react\":\"18.3.3\",\"@types/react-dom\":\"18.3.0\"}}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/postcss.config.js", "size": 58, "content": "module.exports={plugins:{tailwindcss:{},autoprefixer:{}}}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/README.md", "size": 88, "content": "# Frontend\n\n`npm install && npm run dev`\n\nSet `NEXT_PUBLIC_API_URL` to the FastAPI URL.\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/tailwind.config.ts", "size": 166, "content": "import type {Config} from 'tailwindcss'; export default {content:['./app/**/*.{ts,tsx}','./components/**/*.{ts,tsx}'],theme:{extend:{}} ,plugins:[]} satisfies Config\n", "text": true}, {"name": "youtube-shorts-ai-clipper/frontend/tsconfig.json", "size": 296, "content": "{\"compilerOptions\":{\"target\":\"ES2020\",\"lib\":[\"dom\",\"dom.iterable\",\"esnext\"],\"strict\":true,\"noEmit\":true,\"module\":\"esnext\",\"moduleResolution\":\"bundler\",\"jsx\":\"preserve\",\"plugins\":[{\"name\":\"next\"}]},\"include\":[\"next-env.d.ts\",\"**/*.ts\",\"**/*.tsx\",\".next/types/**/*.ts\"],\"exclude\":[\"node_modules\"]}\n", "text": true}, {"name": "youtube-shorts-ai-clipper/README.md", "size": 2178, "content": "# YouTube Long-to-Shorts AI Clipper\n\nProduction-oriented, mobile-first AI clipping platform based on the supplied developer specification.\n\n## What it does\nPaste an authorized YouTube URL, create a background job, download/process the media with `yt-dlp` + FFmpeg, transcribe it, ask an LLM for candidate moments, validate/de-duplicate them, render 9:16 MP4s with captions, and expose the results through a responsive dashboard.\n\n**Rights notice:** Process only videos you are authorized to download, edit and publish and only where platform/API terms permit. Editing/cropping/captions do not automatically make copyrighted material legally safe.\n\n## Stack\n- Next.js + React + TypeScript + Tailwind\n- FastAPI + Pydantic\n- Celery + Redis\n- PostgreSQL\n- FFmpeg + yt-dlp\n- OpenAI transcription + structured clip analysis\n- S3-compatible object storage (S3/R2/Supabase-compatible endpoint)\n- Docker Compose\n\n## Quick local setup\n1. Copy `.env.example` to `.env` and add `OPENAI_API_KEY` plus database/storage values.\n2. Install Docker Desktop or Docker Engine.\n3. Run `docker compose up --build`.\n4. Open `http://localhost:3000`.\n5. Paste a YouTube URL you own/have permission to use.\n\nFor non-Docker development see `docs/LOCAL_DEVELOPMENT.md`.\n\n## Architecture\nBrowser -> Next.js -> FastAPI -> Celery/Redis -> worker -> yt-dlp/FFmpeg/OpenAI -> PostgreSQL + object storage.\n\nLong processing never runs inside the normal API request. The API returns a job ID immediately and the frontend polls job status. Exact progress is stage-based unless the worker can safely calculate a percentage.\n\n## Environment\nSee `.env.example`. Secrets stay server-side.\n\nImportant limits include `MAX_VIDEO_DURATION_SECONDS`, `MAX_FILE_SIZE_MB`, `MAX_CLIPS_PER_JOB`, `MAX_CONCURRENT_JOBS`, `JOB_RETENTION_HOURS`, and `RETRY_COUNT`.\n\n## Testing\n`pytest -q backend/tests`\n\nUnit tests do not call paid external APIs. `backend/tests/fixtures/test.mp4` is generated as a tiny local fixture by the test helper when needed.\n\n## Production\nUse separate API/worker resources when FFmpeg workloads are heavy. Set HTTPS, a real PostgreSQL instance, Redis, and S3/R2-compatible storage. See `docs/DEPLOYMENT.md`.\n", "text": true}];
const list = document.getElementById('list');
const code = document.getElementById('code');
const search = document.getElementById('search');

function render(filter='') {
  list.innerHTML='';
  const f=filter.toLowerCase();
  files.filter(x=>x.name.toLowerCase().includes(f)).forEach((x,idx)=>{
    const b=document.createElement('button');
    b.className='file';
    b.dataset.idx=idx;
    b.innerHTML = '📄 '+x.name.replaceAll('&','&amp;').replaceAll('<','&lt;') +
      '<span class="badge">'+(x.text ? 'code' : (x.size/1024).toFixed(1)+' KB')+'</span>';
    b.onclick=()=>openFile(idx,b);
    list.appendChild(b);
  });
}
function openFile(idx,btn) {
  document.querySelectorAll('.file').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  const x=files[idx];
  code.textContent = x.text ? x.content : 'Binary/non-text file. Size: '+x.size+' bytes';
}
search.oninput=()=>render(search.value);
render();
</script>
